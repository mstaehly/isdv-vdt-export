name: Monatlicher VDT-Mitglieder-Export

on:
  schedule:
    # Läuft jeden 1. des Monats um 08:00 Uhr (UTC)
    - cron: '0 8 1 * *'
  workflow_dispatch:  # Manueller Start möglich (zum Testen)

jobs:
  export-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests python-dateutil pyzipper openpyxl

      - name: VDT-Export ausführen
        env:
          CAMPAI_API_KEY:  ${{ secrets.CAMPAI_API_KEY }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          ZIP_PASSWORD:    ${{ secrets.ZIP_PASSWORD }}
          SMTP_HOST:       smtp.strato.de
          SMTP_PORT:       587
        run: python vdt_export.py
